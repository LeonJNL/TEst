<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal To-Do</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f6;
      --panel: #ffffff;
      --muted: #8b8f97;
      --text: #1d1f23;
      --border: #e2e4e8;
      --accent: #3d3f44;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 32px 20px 12px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      gap: 20px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(27, 29, 33, 0.04);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    section:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(27, 29, 33, 0.08);
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
    }

    input,
    textarea,
    select {
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 10px 14px;
      background: #fafafa;
      font-size: 0.95rem;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 63, 68, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    .button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(61, 63, 68, 0.2);
    }

    .button.secondary {
      background: #d9dbe0;
      color: var(--text);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      background: #f2f2f4;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 16px;
      display: grid;
      gap: 8px;
      background: #fbfbfc;
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .task-card:hover {
      transform: translateY(-2px);
      border-color: #c9ccd3;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .task-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .importance {
      font-weight: 600;
      color: #3d3f44;
    }

    .empty {
      padding: 24px;
      border-radius: 16px;
      border: 1px dashed var(--border);
      color: var(--muted);
      text-align: center;
    }

    .notification-status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Minimal To-Do</h1>
    <p>Organize tasks with calm, focused tools.</p>
  </header>

  <main>
    <section class="stack" aria-label="Task setup">
      <div class="stack">
        <h2>Quick Add</h2>
        <div class="field">
          <label for="categoryName">Create a category</label>
          <input id="categoryName" type="text" placeholder="e.g. Work, Home" />
          <button class="button" id="addCategory">Add category</button>
        </div>
      </div>

      <div class="stack">
        <h2>Create a task</h2>
        <div class="field">
          <label for="taskTitle">Task title</label>
          <input id="taskTitle" type="text" placeholder="Write weekly report" />
        </div>
        <div class="field">
          <label for="taskCategory">Category</label>
          <select id="taskCategory"></select>
        </div>
        <div class="field">
          <label for="taskDeadline">Deadline</label>
          <input id="taskDeadline" type="date" />
        </div>
        <div class="field">
          <label for="taskNotes">Notes</label>
          <textarea id="taskNotes" placeholder="Add context or details"></textarea>
        </div>
        <div class="field">
          <label for="taskImportance">Importance (1 = low, 5 = high)</label>
          <select id="taskImportance">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <button class="button" id="addTask">Add task</button>
      </div>

      <div class="stack">
        <h2>Notifications</h2>
        <p class="notification-status" id="notificationStatus">Push notifications are off.</p>
        <button class="button secondary" id="enableNotifications">Enable notifications</button>
      </div>
    </section>

    <section class="stack" aria-label="Task list">
      <div class="task-header">
        <h2>Tasks overview</h2>
        <div class="pill" id="taskCount">0 tasks</div>
      </div>

      <div class="field">
        <label for="filterCategory">Filter by category</label>
        <select id="filterCategory"></select>
      </div>

      <div class="task-list" id="taskList">
        <div class="empty">No tasks yet. Add your first one!</div>
      </div>
    </section>
  </main>

  <script>
    const categories = ["General"];
    const tasks = [];

    const categoryNameInput = document.getElementById("categoryName");
    const addCategoryButton = document.getElementById("addCategory");
    const taskCategorySelect = document.getElementById("taskCategory");
    const filterCategorySelect = document.getElementById("filterCategory");
    const taskTitleInput = document.getElementById("taskTitle");
    const taskDeadlineInput = document.getElementById("taskDeadline");
    const taskNotesInput = document.getElementById("taskNotes");
    const taskImportanceSelect = document.getElementById("taskImportance");
    const addTaskButton = document.getElementById("addTask");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const notificationStatus = document.getElementById("notificationStatus");
    const enableNotificationsButton = document.getElementById("enableNotifications");

    const renderCategoryOptions = () => {
      taskCategorySelect.innerHTML = "";
      filterCategorySelect.innerHTML = "";

      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        taskCategorySelect.appendChild(option.cloneNode(true));
        filterCategorySelect.appendChild(option);
      });

      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "All categories";
      filterCategorySelect.insertBefore(allOption, filterCategorySelect.firstChild);
      filterCategorySelect.value = "all";
    };

    const renderTasks = () => {
      const selectedCategory = filterCategorySelect.value;
      const filtered = selectedCategory === "all"
        ? tasks
        : tasks.filter((task) => task.category === selectedCategory);

      taskList.innerHTML = "";

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No tasks match this view.";
        taskList.appendChild(empty);
      } else {
        filtered
          .slice()
          .sort((a, b) => b.importance - a.importance)
          .forEach((task) => {
            const card = document.createElement("div");
            card.className = "task-card";

            const header = document.createElement("div");
            header.className = "task-header";

            const title = document.createElement("div");
            title.className = "task-title";
            title.textContent = task.title;

            const importance = document.createElement("div");
            importance.className = "importance";
            importance.textContent = `Importance ${task.importance}`;

            header.append(title, importance);

            const meta = document.createElement("div");
            meta.className = "meta";
            meta.innerHTML = `
              <span class="pill">${task.category}</span>
              <span class="pill">Deadline: ${task.deadline || "No deadline"}</span>
            `;

            const notes = document.createElement("div");
            notes.textContent = task.notes || "No notes added.";

            card.append(header, meta, notes);
            taskList.appendChild(card);
          });
      }

      taskCount.textContent = `${tasks.length} task${tasks.length === 1 ? "" : "s"}`;
    };

    const updateNotificationStatus = () => {
      if (!("Notification" in window)) {
        notificationStatus.textContent = "Push notifications are not supported in this browser.";
        enableNotificationsButton.disabled = true;
        return;
      }

      const statusMap = {
        granted: "Push notifications are enabled.",
        denied: "Push notifications are blocked in your browser settings.",
        default: "Push notifications are off.",
      };

      notificationStatus.textContent = statusMap[Notification.permission] || statusMap.default;
      enableNotificationsButton.disabled = Notification.permission === "granted";
    };

    addCategoryButton.addEventListener("click", () => {
      const name = categoryNameInput.value.trim();
      if (!name || categories.includes(name)) {
        categoryNameInput.value = "";
        return;
      }
      categories.push(name);
      categoryNameInput.value = "";
      renderCategoryOptions();
    });

    addTaskButton.addEventListener("click", () => {
      const title = taskTitleInput.value.trim();
      if (!title) {
        taskTitleInput.focus();
        return;
      }
      tasks.push({
        title,
        category: taskCategorySelect.value,
        deadline: taskDeadlineInput.value,
        notes: taskNotesInput.value.trim(),
        importance: Number(taskImportanceSelect.value),
      });

      taskTitleInput.value = "";
      taskDeadlineInput.value = "";
      taskNotesInput.value = "";
      taskImportanceSelect.value = "3";
      renderTasks();
    });

    filterCategorySelect.addEventListener("change", renderTasks);

    enableNotificationsButton.addEventListener("click", async () => {
      if (!("Notification" in window)) {
        updateNotificationStatus();
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        new Notification("Notifications enabled", {
          body: "We will remind you about important tasks.",
        });
      }
      updateNotificationStatus();
    });

    renderCategoryOptions();
    renderTasks();
    updateNotificationStatus();
  </script>
</body>
</html>
